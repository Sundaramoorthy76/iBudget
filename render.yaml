databases:
  - name: ibudget-db
    databaseName: ibudget
    user: ibudget
    plan: free
    region: oregon

services:
  - type: web
    name: ibudget-api
    runtime: docker
    dockerfilePath: ./ibudget-backend/Dockerfile
    dockerContext: ./ibudget-backend
    plan: free
    region: oregon
    healthCheckPath: /api/budget/summary
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_HOST
        fromDatabase:
          name: ibudget-db
          property: host
      - key: SPRING_DATASOURCE_PORT
        fromDatabase:
          name: ibudget-db
          property: port
      - key: SPRING_DATASOURCE_DATABASE
        fromDatabase:
          name: ibudget-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ibudget-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ibudget-db
          property: password

  - type: web
    name: ibudget-ui
    runtime: static
    rootDir: ibudget-frontend
    buildCommand: npm ci --no-fund --no-audit && npm run build
    staticPublishPath: dist/ibudget-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
