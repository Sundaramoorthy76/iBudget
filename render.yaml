services:
  - type: web
    name: ibudget-api
    runtime: docker
    dockerfilePath: ./ibudget-backend/Dockerfile
    dockerContext: ./ibudget-backend
    plan: free
    region: oregon
    healthCheckPath: /api/budget/summary
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false

  - type: web
    name: ibudget-ui
    runtime: static
    rootDir: ibudget-frontend
    buildCommand: npm ci --no-fund --no-audit && npm run build
    staticPublishPath: dist/ibudget-frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
