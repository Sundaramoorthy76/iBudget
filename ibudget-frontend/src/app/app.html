<div class="app-shell">
  <aside class="sidebar">
    <div class="brand-block">
      <div class="brand-mark">i</div>
      <div><p class="eyebrow">Budget</p><h2>iBudget</h2></div>
    </div>
    <nav class="nav-menu" aria-label="Main navigation">
      <button type="button" [class.active]="selectedView === 'dashboard'" (click)="selectView('dashboard')">Dashboard</button>
      <button type="button" [class.active]="selectedView === 'income'" (click)="selectView('income')">Income</button>
      <button type="button" [class.active]="selectedView === 'expense'" (click)="selectView('expense')">Expenses</button>
      <button type="button" [class.active]="selectedView === 'employees'" (click)="selectView('employees')">Employees</button>
      <button type="button" [class.active]="selectedView === 'salary-records'" (click)="selectView('salary-records')">Advances &amp; Deductions</button>
      <button type="button" [class.active]="selectedView === 'reports'" (click)="selectView('reports')">Reports</button>
    </nav>
  </aside>

  <main class="main-panel">
    <header class="topbar">
      <div>
        <p class="eyebrow">Home Budget Dashboard</p>
        <h1>{{ pageTitle }}</h1>
      </div>
      <div class="summary-pill" [class.positive]="summary.balance >= 0" *ngIf="showsBudgetSummary">
        {{ formatCurrency(summary.balance) }} remaining
      </div>
    </header>

    <section class="summary-grid" *ngIf="selectedView === 'dashboard' || selectedView === 'reports'">
      <article class="summary-card income"><span>Total income</span><strong>{{ formatCurrency(summary.totalIncome) }}</strong></article>
      <article class="summary-card expense"><span>Total expenses</span><strong>{{ formatCurrency(summary.totalExpense) }}</strong></article>
      <article class="summary-card balance"><span>Balance</span><strong>{{ formatCurrency(summary.balance) }}</strong></article>
    </section>

    <app-dashboard-screen
      *ngIf="selectedView === 'dashboard'"
      [entries]="entries"
      [incomeCount]="incomeEntries.length"
      [expenseCount]="expenseEntries.length">
    </app-dashboard-screen>

    <app-transactions-screen
      *ngIf="selectedView === 'income' || selectedView === 'expense'"
      [view]="selectedView === 'income' ? 'income' : 'expense'"
      [entries]="entries"
      [form]="form"
      [readOnly]="isReadOnly"
      [editing]="isEditing"
      (submitted)="submitForm()"
      (viewed)="viewEntry($event)"
      (edited)="editEntry($event)"
      (deleted)="deleteEntry($event)"
      (cancelled)="cancelEdit()">
    </app-transactions-screen>

    <app-reports-screen
      *ngIf="selectedView === 'reports'"
      [entries]="entries"
      [summary]="summary">
    </app-reports-screen>

    <app-employees-screen
      *ngIf="selectedView === 'employees'"
      [employees]="employees"
      [form]="employeeForm"
      [editingId]="employeeEditingId"
      [readOnly]="employeeReadOnly"
      [selectedEmployeeId]="selectedEmployeeId"
      [error]="employeeError"
      (add)="startNewEmployee()"
      (save)="saveEmployee()"
      (view)="viewEmployee($event)"
      (edit)="editEmployee($event)"
      (toggleStatus)="toggleEmployeeStatus($event)">
    </app-employees-screen>

    <app-salary-records-screen
      *ngIf="selectedView === 'salary-records'"
      [employees]="employees"
      [selectedEmployee]="selectedEmployee"
      [employeeForm]="employeeForm"
      [records]="salaryRecords"
      [form]="salaryRecordForm"
      [editingId]="salaryRecordEditingId"
      [readOnly]="salaryRecordReadOnly"
      [error]="salaryRecordError"
      (selectEmployee)="selectEmployee($event)"
      (save)="saveSalaryRecord()"
      (cancel)="salaryRecordReadOnly ? closeSalaryRecordView() : cancelSalaryRecordEdit()"
      (view)="viewSalaryRecord($event)"
      (edit)="editSalaryRecord($event)"
      (delete)="deleteSalaryRecord($event)"
      (back)="backToEmployeeList()">
    </app-salary-records-screen>
  </main>
</div>
